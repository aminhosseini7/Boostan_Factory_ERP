services:
  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    env_file: ../backend/.env
    ports: ["5000:5000"]
  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports: ["8080:80"]
    depends_on: [backend]
